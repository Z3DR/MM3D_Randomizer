  <main class="page-container">
    <div id="markdownContainer" class="markdown-body">
      <p class="subtext">Loading Emulator Setup Guide...</p>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('markdownContainer');
      
      function parseMkDocsCallouts(markdownText) {
        const inlineCalloutRegex = /(?:\?\?\?|\?\?\?\+|!!!)\s*([\w-]*)\s*(?:"([^"]+)"|'([^']+)')?\s*/g;
        return markdownText.replace(inlineCalloutRegex, (match, type, title1, title2) => {
          const title = title1 || title2 || (type ? type.toUpperCase() : "Details");
          const isOpen = match.startsWith('???+');
          return `\n\n<details class="mkdocs-callout ${type.toLowerCase()}" ${isOpen ? 'open' : ''}>\n<summary>${title}</summary>\n\n`;
        }) + "\n</details>";
      }

      const renderer = new marked.Renderer();
      renderer.link = function({ href, title, text }) {
        const titleAttr = title ? ` title="${title}"` : '';
        return `<a href="${href}"${titleAttr} target="_blank" rel="noopener noreferrer">${text}</a>`;
      };
      renderer.image = function({ href, title, text }) {
        let imageSrc = href.startsWith('./') ? '../Docs/' + href.slice(2) : (!href.startsWith('http') && !href.startsWith('../Docs/') ? '../Docs/' + href : href);
        const titleAttr = title ? ` title="${title}"` : '';
        const altAttr = text ? ` alt="${text}"` : '';
        return `<img src="${imageSrc}"${altAttr}${titleAttr} class="md-image" />`;
      };

      marked.use({ renderer });

      fetch('../docs/setup-guide-emulator.md')
        .then(res => res.ok ? res : fetch('../docs/setup-guide-emulator.md'))
        .then(res => res.text())
        .then(text => container.innerHTML = marked.parse(parseMkDocsCallouts(text)))
        .catch(err => container.innerHTML = `<p class="subtext">Error loading <code>../docs/setup-guide-emulator.md</code>.</p>`);
    });
  </script>

  <!-- Footer -->
  <footer class="footer">
    <p>Majora's Mask 3D Randomizer</p>
    <p class="copyright">This is an unofficial website configured for Majora's Mask 3D Randomizer.</p>
  </footer>
  
</body>
