    <!-- Inline Script to Fetch & Render Docs/faq.md -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const container = document.getElementById('markdownContainer');
    
    // Check if running directly via file protocol
    if (window.location.protocol === 'file:') {
      container.innerHTML = `
        <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); padding: 1.5rem; border-radius: 8px;">
          <h3 style="color: #ef4444; margin-top: 0;"><i class="fa-solid fa-triangle-exclamation"></i> CORS Security Restriction</h3>
          <p>Browsers block local <code>fetch()</code> requests when opening files directly via <code>file:///</code> URLs.</p>
          <p>To view this page locally, please run a local web server (e.g., using <strong>VS Code Live Server</strong> or <code>python -m http.server</code> in your terminal).</p>
        </div>
      `;
      return;
    }

    // Configure Marked.js renderer
    const renderer = new marked.Renderer();
    
    // Open links in new tabs safely
    renderer.link = function({ href, title, text }) {
        const titleAttr = title ? ` title="${title}"` : '';
        return `<a href="${href}"${titleAttr} target="_blank" rel="noopener noreferrer">${text}</a>`;
    };
    
    // Fix relative image paths to resolve inside the Docs/ directory
    renderer.image = function({ href, title, text }) {
        let imageSrc = href;
        
        // If path starts with ./ or img/, prepend Docs/
        if (imageSrc.startsWith('./')) {
            imageSrc = '../Docs/' + imageSrc.slice(2);
        } else if (!imageSrc.startsWith('http') && !imageSrc.startsWith('../Docs/')) {
            imageSrc = '../Docs/' + imageSrc;
        }
        
        const titleAttr = title ? ` title="${title}"` : '';
        const altAttr = text ? ` alt="${text}"` : '';
        
        return `<img src="${imageSrc}"${altAttr}${titleAttr} class="md-image" />`;
    };
    
    marked.use({ renderer });
    // Pre-processor for MkDocs collapsible callout syntax (??? or !!!)
    function parseMkDocsCallouts(markdownText) {
  // Matches ??? [type] "Title" inline or on a new line
  const inlineCalloutRegex = /(?:\?\?\?|\?\?\?\+|!!!)\s*([\w-]*)\s*(?:"([^"]+)"|'([^']+)')?\s*/g;

  return markdownText.replace(inlineCalloutRegex, (match, type, title1, title2) => {
    const title = title1 || title2 || (type ? type.toUpperCase() : "Details");
    const isOpen = match.startsWith('???+');
    
    // Inserts HTML details tag; Marked.js will render the text inside as Markdown
    return `\n\n<details class="mkdocs-callout ${type.toLowerCase()}" ${isOpen ? 'open' : ''}>\n<summary>${title}</summary>\n\n`;
  }) + "\n</details>"; // Closes the details container
}

    // Fetch and render Docs/faq.md
    fetch('../Docs/faq.md')
      .then(response => {
        if (!response.ok) {
          return fetch('../Docs/faq.md');
        }
        return response;
      })
      .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}: Could not locate file`);
        return response.text();
      })
      .then(markdownText => {
        // 1. Process MkDocs callout syntax first
        const processedText = parseMkDocsCallouts(markdownText);
        container.innerHTML = marked.parse(processedText);
      })
      .catch(error => {
        console.error('Error loading markdown:', error);
        container.innerHTML = `
          <p class="subtext">
            Failed to load resources markdown file. Ensure <code>../Docs/faq.md</code> exists and your web server has read permissions.
            <br><small style="opacity: 0.7;">Details: ${error.message}</small>
          </p>
        `;
      });
  });
</script>
