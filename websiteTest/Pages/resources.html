  <!-- Inline Script to Fetch & Render Docs/resources.md -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const container = document.getElementById('markdownContainer');
    
    // Check if running directly via file protocol
    if (window.location.protocol === 'file:') {
      container.innerHTML = `
        <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); padding: 1.5rem; border-radius: 8px;">
          <h3 style="color: #ef4444; margin-top: 0;"><i class="fa-solid fa-triangle-exclamation"></i> CORS Security Restriction</h3>
          <p>Browsers block local <code>fetch()</code> requests when opening files directly via <code>file:///</code> URLs.</p>
          <p>To view this page locally, please run a local web server (e.g., using <strong>VS Code Live Server</strong> or <code>python -m http.server</code> in your terminal).</p>
        </div>
      `;
      return;
    }

    // Configure Marked.js to open links in a new tab
    const renderer = new marked.Renderer();
    renderer.link = function({ href, title, text }) {
      const titleAttr = title ? ` title="${title}"` : '';
      return `<a href="${href}"${titleAttr} target="_blank" rel="noopener noreferrer">${text}</a>`;
    };

    marked.use({ renderer });

    // Fetch and render Docs/resources.md
    fetch('../Docs/resources.md')
      .then(response => {
        if (!response.ok) {
          return fetch('../Docs/resources.md');
        }
        return response;
      })
      .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}: Could not locate file`);
        return response.text();
      })
      .then(markdownText => {
        container.innerHTML = marked.parse(markdownText);
      })
      .catch(error => {
        console.error('Error loading markdown:', error);
        container.innerHTML = `
          <p class="subtext">
            Failed to load resources markdown file. Ensure <code>../Docs/resources.md</code> exists and your web server has read permissions.
            <br><small style="opacity: 0.7;">Details: ${error.message}</small>
          </p>
        `;
      });
  });
</script>
